<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Speed Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="main-heading">Typing Speed Test</h1>
  <div class="container">

    <div class="stats">
      <div class="stat"><span id="wpm">0</span><small>WPM</small></div>
      <div class="stat"><span id="accuracy">100</span><small>Accuracy %</small></div>
      <div class="stat"><span id="time">0</span><small>Seconds</small></div>
    </div>

    <div id="sentence"></div>

    <textarea id="input" placeholder="Start typing here..." autofocus></textarea>

    <button id="restart">New sentence</button>
    
    <!-- <p id="result"></p> -->
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
